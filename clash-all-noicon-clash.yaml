  tolerance: 150                       # 保持 150ms 容差，防止看视频时因轻微延迟波动频繁切换节点导致断流
  interval: 300
  timeout: 2000                        # 缩短测速超时至 2000ms，快速感知并跳过死节点
  lazy: true                           # 按需测速，避免未使用的国家组在后台并发测速

