# ========================
# 规则引擎（rules）
# V7 源码级修正：
# 将 WebRTC STUN 多端口拦截从逗号 `,` 修正为斜杠 `/`：(DST-PORT,3478/5349/19302)
# （在 Mihomo 解析器中，子规则按逗号切分字段，写成 3478,5349,19302 会导致 5349 和 19302 被当成无效附加参数丢弃！）
# ========================
rules:
  - SRC-IP-CIDR,172.16.3.7/32,DIRECT,no-resolve   # 国内DNS服务器(.7)直连，上游为国内DNS无需代理
  - SRC-IP-CIDR,172.16.3.6/32,国外,no-resolve      # 国外DNS服务器(.6)强制走代理，确保8.8.4.4等可达
  # 局域网与私有地址置顶直连
  - RULE-SET,Private/Domain,DIRECT
  - RULE-SET,Private/IP,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve            # loopback 直连
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve           # ULA 私有地址直连
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve          # 链路本地地址直连
  # 仅置顶纯国内测速站与 Apple 国内 CDN 直连
  - DOMAIN-SUFFIX,speedtest.cn,DIRECT
  - DOMAIN-SUFFIX,chinabroadband.net,DIRECT
  - RULE-SET,Apple-CN/Domain,DIRECT
  # 广告及黑名单拦截（MetaCubeX 官方 category-ads-all.mrs）
  - RULE-SET,Block/Domain,拒绝
  # 拦截 WebRTC STUN 探测端口 (必须用 `/` 分隔多端口!) + 拦截 YouTube/Google 的 UDP 443 (QUIC/HTTP3)
  - AND,((NETWORK,udp),(DST-PORT,3478/5349/19302)),拒绝
  - AND,((NETWORK,udp),(DST-PORT,443),(RULE-SET,Youtube/Domain)),拒绝
  - AND,((NETWORK,udp),(DST-PORT,443),(RULE-SET,Google/Domain)),拒绝
  - AND,((NETWORK,udp),(DST-PORT,443),(RULE-SET,Google/IP,no-resolve)),拒绝
  # AI 与海外专项分流
  - RULE-SET,ChatGPT/Domain,ChatGPT
  - RULE-SET,Claude/Domain,Claude
  - RULE-SET,Meta AI/Domain,Meta AI,no-resolve
  - RULE-SET,Gemini/Domain,Gemini
  - RULE-SET,Perplexity/Domain,Perplexity
  - RULE-SET,Copilot/Domain,Microsoft,no-resolve
  - RULE-SET,GitHub/Domain,GitHub
  - RULE-SET,Telegram/Domain,Telegram
  - RULE-SET,Telegram/IP,Telegram,no-resolve
  - RULE-SET,Twitter/Domain,Twitter(X)
  - RULE-SET,WhatsApp/Domain,WhatsApp,no-resolve
  - RULE-SET,Facebook/Domain,Facebook
  - RULE-SET,Amazon/Domain,Amazon
  - RULE-SET,Apple/Domain,Apple
  - RULE-SET,Microsoft/Domain,Microsoft
  - RULE-SET,OKX/Domain,Crypto
  - RULE-SET,Bybit/Domain,Crypto
  - RULE-SET,Binance/Domain,Crypto
  - RULE-SET,Youtube/Domain,YouTube
  - RULE-SET,TikTok/Domain,TikTok
  - RULE-SET,Netflix/Domain,Netflix
  - RULE-SET,Netflix/IP,Netflix,no-resolve
  - RULE-SET,Disney/Domain,Disney
  - RULE-SET,HBO/Domain,HBO
  - RULE-SET,Spotify/Domain,Spotify
  - RULE-SET,Crunchyroll/Domain,国外,no-resolve
  - RULE-SET,Reddit/Domain,国外
  - RULE-SET,Nvidia/Domain,国外,no-resolve
  - RULE-SET,Steam/Domain,Steam
  - RULE-SET,Epic/Domain,Game,no-resolve
  - RULE-SET,EA/Domain,Game,no-resolve
  - RULE-SET,Blizzard/Domain,Game,no-resolve
  - RULE-SET,UBI/Domain,Game,no-resolve
  - RULE-SET,PlayStation/Domain,Game,no-resolve
  - RULE-SET,Nintendo/Domain,Game,no-resolve
  - RULE-SET,Google/Domain,Google
  - RULE-SET,Google/IP,Google,no-resolve
  # 海外全量规则优先于 Direct/Domain，防止海外检测站被 Direct.list 误伤直连
  - RULE-SET,GeoLocation-!CN/Domain,国外
  - RULE-SET,Proxy/Domain,国外,no-resolve
  - RULE-SET,Globe/Domain,国外,no-resolve
  # 国内全量域名与 IP 兜底直连
  - RULE-SET,Direct/Domain,DIRECT,no-resolve
  - RULE-SET,China/Domain,DIRECT
  - RULE-SET,China/IP,DIRECT,no-resolve
  # 组播与保留地址直连
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,240.0.0.0/4,DIRECT,no-resolve
  - MATCH,国外

# ========================
# 规则集提供者（所有链接 100% 经过真实性核验）
# ========================
rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }
  class: &class { type: http, interval: 86400, behavior: classical, format: text }

rule-providers:
  ChatGPT/Domain: { <<: *domain, url: "https://gh-proxy.org/https://github.com/metacubex/meta-rules-dat/raw/refs/heads/meta/geo/geosite/openai.mrs" }
