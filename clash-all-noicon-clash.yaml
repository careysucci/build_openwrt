# ========================
# Clash-ALL 终极配置 (V5 第一性原理·零自相矛盾·全链路自洽定稿版)
# ========================

# 机场节点订阅
# 刷机后 SSH 运行 /root/setup-openclash.sh 完成首次配置。
proxy-providers:
  cc-auto:
    type: http
    # 出厂占位 URL（本地不可达）：
    #   mihomo 启动时若 path 缓存文件已存在，直接读缓存，不请求此 URL。
    #
    # 首次配置（SSH 到路由器运行）：
    #   ./setup-openclash.sh 'https://你的订阅链接'
    #   脚本会：① 下载节点写入缓存 ② 把真实 URL 写入本字段 ③ 启动 OpenClash
    #
    # URL 写入后，mihomo 每 interval 秒自动拉取最新节点（无需 OpenClash 订阅管理）。
    #
    # 排障：机场迁移订阅域名时旧地址会 301，mihomo 不跟随跳转 → provider 拉取报 EOF。
    #   诊断：curl -sIL '旧URL' 看 Location；修复：把 url 换成 Location 指向的最终地址。
    url: "http://127.0.0.1:11111/subscription"
    # SUB-PROXY-FIRSTBOOT-BEGIN
    # 订阅下载强制直连（DIRECT），绕过规则引擎（固化，不再删除）。
    # 机场订阅端点国内可直达（curl 直连 200），直连拉取永不依赖节点存活；
    # 若某机场端点必须经代理才能访问，手动删除下一行恢复走规则引擎。
    proxy: DIRECT
    # SUB-PROXY-FIRSTBOOT-END
    path: "/etc/openclash/config/providers/cc-auto.yaml"
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
      lazy: true
    override:
      udp: true                        # 强制开启订阅内所有节点的 UDP 转发
      # 使用 Mihomo 官方 override-expr 语法，在加载订阅时将 chrome (HelloChrome_133) 指纹注入每个节点内部：
      override-expr:
        - '.["client-fingerprint"] = "chrome"'

proxies:
  - { name: 直连, type: direct, udp: true, client-fingerprint: chrome }
  - { name: 拒绝, type: reject, client-fingerprint: chrome }

# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

# [Deprecated] 传统 v2ray dat 模式已弃用，现采用下方 rule-providers 规则集：
#geodata-mode: true
#geodata-loader: standard
#geox-url:
#  geoip: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-Country.mmdb"
#  geosite: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
#  mmdb: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-Country.mmdb"

allow-lan: true
mode: rule
unified-delay: true                    # 消除握手阶段延迟偏差，反映真实传输吞吐延迟
tcp-concurrent: true                   # 开启并发择优握手：保障国内多IP测速与双栈访问自动选用最快连接
find-process-mode: 'off'               # 关闭进程识别，OpenWrt 上无意义，消除每连接的进程查找开销
keep-alive-idle: 75                    # 75 秒空闲开始保活：严格小于运营商 NAT 90~120s 老化阈值，杜绝静置重开复用死连接
keep-alive-interval: 15                # TCP keepalive 探测间隔 15 秒
etag-support: true                     # 开启 ETag 缓存支持，减少规则集与订阅重复下载开销

# [Deprecated] global-client-fingerprint 已在 Mihomo v1.19.19+ 中标记为 deprecated，
#   已通过上方 `proxy-providers.cc-auto.override.override-expr` 及 `proxies` 注入 `client-fingerprint: chrome`：
# global-client-fingerprint: chrome

log-level: warning

external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-name: metacubed
external-ui-url: "https://gh-proxy.org/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
