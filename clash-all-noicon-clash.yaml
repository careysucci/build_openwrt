default: &default
  type: select
  proxies: [ 直连,所有-手动,所有-自动,香港-自动,台湾-自动,日本-自动,新加坡-自动,韩国-自动,美国-自动,英国-自动,越南-自动,印度-自动,德国-自动,法国-自动,其他-自动,拒绝 ]
second: &second
  type: select
  proxies: [ 日本-自动,香港-自动,台湾-自动,新加坡-自动,韩国-自动,美国-自动,所有-手动,所有-自动,英国-自动,越南-自动,印度-自动,德国-自动,法国-自动,其他-自动,直连,拒绝 ]
third: &third
  type: select
  proxies: [ 美国-自动,日本-自动,台湾-自动,新加坡-自动,韩国-自动,英国-自动,德国-自动,法国-自动,香港-自动,所有-手动,所有-自动,越南-自动,印度-自动,其他-自动,直连,拒绝 ]
auto_opt: &auto_opt
  type: url-test
  url: https://www.gstatic.com/generate_204
