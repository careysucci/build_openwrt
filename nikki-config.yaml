# ========================
# Nikki (mihomo) 优化配置
# ========================
# 与 clash-all-noicon-clash.yaml 保持相同的分流逻辑和防泄漏策略
# 适用于 luci-app-nikki (OpenWrt mihomo 前端)

# 机场节点订阅
proxy-providers:
  cc-auto:
    # 在线订阅 + 本地缓存（同 OpenClash）：开箱即用，自动定期更新。
    # url 由 build-openclash.sh 用环境变量 CLASH_SUB_URL 注入；path 为本地缓存，
    # 支持首次手动 bootstrap 一次，之后按 interval 全自动更新。
    type: http
    url: "__CLASH_SUB_URL__"
    path: "/etc/nikki/run/providers/cc-auto.yaml"
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxies:
  - { name: 直连, type: direct }
  - { name: 拒绝, type: reject }

# ========================
# 主要端口设置（OpenClash +1，避免冲突）
# ========================
port: 7900
socks-port: 7901
redir-port: 7902
mixed-port: 7903
tproxy-port: 7905

allow-lan: true
mode: rule
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
keep-alive-interval: 30
keep-alive-idle: 600
global-client-fingerprint: chrome
log-level: warning

geodata-mode: true
geodata-loader: standard
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-Country.mmdb"
  geosite: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-Country.mmdb"


external-controller: 127.0.0.1:9091
external-ui: ui
external-ui-name: metacubed
external-ui-url: "https://gh-proxy.org/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
secret: "nk_7Xm2pQ9wR4tK8vL1nJ6cF3bA5yD0e"

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7884
  ipv6: true
  enhanced-mode: redir-host
  respect-rules: false
  fake-ip-range: 198.20.0.1/16
  default-nameserver:
    - 172.16.3.7
  nameserver:
    - 172.16.3.6
  proxy-server-nameserver:
    - 172.16.3.7
  nameserver-policy:
    "+.lan":
      - 172.16.3.7
    "+.local":
      - 172.16.3.7
    "geosite:private":
      - 172.16.3.7
    "geosite:cn":
      - 172.16.3.7
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "geosite:cn"
    - "+.holytech.bid"
    - "+.holytechx.com"

ipv6: true

# ========================
# TUN 模块（已禁用，使用 tproxy）
# ========================
tun:
  enable: false
  stack: mixed

profile:
  store-selected: true
  store-fake-ip: true

# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies: [ 直连,所有-手动,所有-自动,香港-自动,台湾-自动,日本-自动,新加坡-自动,韩国-自动,美国-自动,英国-自动,越南-自动,印度-自动,德国-自动,法国-自动,其他-自动,拒绝 ]
second: &second
  type: select
  proxies: [ 日本-自动,台湾-自动,新加坡-自动,韩国-自动,美国-自动,英国-自动,越南-自动,印度-自动,德国-自动,法国-自动,其他-自动,拒绝 ]
third: &third
  type: select
  proxies: [ 美国-自动,日本-自动,台湾-自动,新加坡-自动,韩国-自动,英国-自动,越南-自动,印度-自动,德国-自动,法国-自动,其他-自动,拒绝 ]

proxy-groups:
  - { name: ChatGPT, <<: *third }
  - { name: Claude, <<: *third }
  - { name: Meta AI, <<: *third }
  - { name: Gemini, <<: *second }
  - { name: Perplexity, <<: *third }
  - { name: GitHub, <<: *second }
  - { name: Telegram, <<: *second }
  - { name: Twitter(X), <<: *second }
  - { name: WhatsApp, <<: *second }
  - { name: Facebook, <<: *second }
  - { name: Steam, <<: *second }
  - { name: Game, <<: *second }
  - { name: YouTube, <<: *second }
  - { name: TikTok, <<: *second }
  - { name: Disney, <<: *second }
  - { name: Netflix, <<: *second }
  - { name: HBO, <<: *second }
  - { name: Spotify, <<: *second }
  - { name: Crypto, <<: *second }
  - { name: Amazon, <<: *second }
  - { name: Apple, <<: *default }
  - { name: Microsoft, <<: *second }
  - { name: Google, <<: *second }
  - { name: Test, <<: *default }
  - { name: 国外, <<: *second }
  - { name: 国内, <<: *default }
  - { name: 其他, <<: *second }
  - { name: 所有-手动, type: select, include-all: true, filter: "^((?!(直连|拒绝)).)*$" }
  - { name: 所有-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "^((?!(直连|拒绝)).)*$" }
  - { name: 香港-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$" }
  - { name: 台湾-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$" }
  - { name: 日本-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$" }
  - { name: 新加坡-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$" }
  - { name: 韩国-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "(?=.*(广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea)).*$" }
  - { name: 美国-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$" }
  - { name: 英国-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "(?=.*(UK|uk|英国)).*$" }
  - { name: 越南-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "(?=.*(VN|vn|越南)).*$" }
  - { name: 印度-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "(?=.*(IN|in|印度)).*$" }
  - { name: 德国-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "(?=.*(DE|de|德国)).*$" }
  - { name: 法国-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "(?=.*(FR|fr|法国)).*$" }
  - { name: 其他-自动, type: url-test, include-all: true, tolerance: 150, interval: 300, filter: "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|英国|UK)).)*$" }

